name: Evaluation

# 评测独立 workflow：与主 CI（ci.yml）完全分离，评测失败不影响主流程。
on:
  pull_request:
    paths:
      - "evaluation/**"
      - ".github/workflows/eval.yml"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      real_mode:
        description: "运行真实 LLM 评测（需在 Secrets 配置 EVAL_* / OPENAI_* 凭据）"
        type: boolean
        default: false
      persona:
        description: "画像选择（all 或 persona_id）"
        type: string
        default: "all"

# PR 评论回归摘要需要写权限；失败不影响合并（step 级 continue-on-error）
permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------- 单元测试：评测模块自身 ----------
  eval-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install eval deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[eval]" pytest
      - name: Run evaluation unit tests
        run: python -m pytest evaluation/tests -v --tb=short
        env:
          EVAL_MODE: mock

  # ---------- mock 评测：零 token 管路验证（默认） ----------
  mock-eval:
    runs-on: ubuntu-latest
    needs: eval-tests
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install eval deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[eval]"
      - name: Run mock evaluation (all personas)
        run: |
          EVAL_MODE=mock timeout 120 python -m evaluation.cli run \
            --persona all --max-turns 8 --eval-mode mock \
            --output evaluation_artifacts
      - name: Upload evaluation report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report-mock
          path: |
            evaluation_artifacts/**/report.md
            evaluation_artifacts/**/report.html
            evaluation_artifacts/**/metrics.json
            evaluation_artifacts/**/trajectory.jsonl
          retention-days: 30
      - name: Comment regression summary on PR
        if: github.event_name == 'pull_request' && !cancelled()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const root = 'evaluation_artifacts';
            let metrics = null;
            let runId = null;
            try {
              const dirs = fs.readdirSync(root)
                .filter(d => d.startsWith('run-'))
                .sort();
              runId = dirs[dirs.length - 1];
              metrics = JSON.parse(
                fs.readFileSync(path.join(root, runId, 'metrics.json'), 'utf8')
              );
            } catch (e) {
              // 评测失败未产出 metrics.json 时也发一条说明，便于在 PR 上直接看到
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '## 📊 评测回归摘要\n\n⚠️ mock 评测未产出 metrics.json（评测步骤失败或超时），请查看 Actions 日志与 Artifacts。',
              });
              return;
            }

            const dimNames = {
              task_completion: '任务完成',
              multi_turn_consistency: '多轮一致性',
              tool_calling_accuracy: '工具调用准确',
              hallucination: '幻觉控制',
              safety_violation: '安全合规',
            };
            const fmt = (v) =>
              v === null || v === undefined ? 'N/A' : Number(v).toFixed(2);

            let rows = '';
            for (const [key, name] of Object.entries(dimNames)) {
              const d = metrics.by_dimension && metrics.by_dimension[key];
              if (!d) continue;
              const status = d.score === null ? '—' : d.passed ? '✅' : '❌';
              rows += `| ${name} | ${fmt(d.score)} | ${fmt(d.threshold)} | ${status} |\n`;
            }

            const gate = metrics.safety_gate_tripped
              ? '🚨 **安全门触发**'
              : '未触发';
            const body = [
              '## 📊 评测回归摘要（mock 模式）',
              '',
              `**Overall：${fmt(metrics.overall)}** ${metrics.passed ? '✅ PASS' : '❌ FAIL'} · 安全门：${gate} · 场景数：${metrics.episode_count} · run：\`${runId}\``,
              '',
              '| 维度 | 得分 | 阈值 | 结果 |',
              '|---|---|---|---|',
              rows,
              '',
              metrics.error_episodes && metrics.error_episodes.length
                ? `⚠️ 错误场景：${metrics.error_episodes.join(', ')}`
                : '',
              '',
              '<sub>由 Evaluation workflow 自动生成 · mock 模式仅验证管路 · 完整报告见 Artifacts（evaluation-report-mock）</sub>',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  # ---------- 真实评测：仅手动触发（continue-on-error，不阻塞任何合并） ----------
  real-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.real_mode == true
    runs-on: ubuntu-latest
    needs: eval-tests
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps (main + eval)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[eval]"
      - name: Run real evaluation
        env:
          EVAL_MODE: real
          EVAL_SIM_API_BASE: ${{ secrets.EVAL_SIM_API_BASE }}
          EVAL_SIM_API_KEY: ${{ secrets.EVAL_SIM_API_KEY }}
          EVAL_SIM_MODEL: ${{ secrets.EVAL_SIM_MODEL }}
          EVAL_JUDGE_API_BASE: ${{ secrets.EVAL_JUDGE_API_BASE }}
          EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY }}
          EVAL_JUDGE_MODEL: ${{ secrets.EVAL_JUDGE_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
          ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
          ROUTER_API_BASE: ${{ secrets.ROUTER_API_BASE }}
          ROUTER_MODEL_NAME: ${{ secrets.ROUTER_MODEL_NAME }}
          FEISHU_APP_ID: dummy
          FEISHU_APP_SECRET: dummy
          DATABASE_URL: sqlite:///./eval_real.db
        run: |
          python -m evaluation.cli run \
            --persona "${{ inputs.persona }}" --max-turns 5 --eval-mode real \
            --output evaluation_artifacts_real
      - name: Upload real evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report-real
          path: evaluation_artifacts_real
          retention-days: 30
