services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # SQLite 放入命名卷: 容器重建/升级不丢数据 (含归档对话历史、
      # 待确认动作回滚登记、会话摘要); WAL 边车文件 (-wal/-shm) 随库同目录。
      # 用命名卷而非 bind mount: 首次使用自动继承镜像内目录的 appuser 属主,
      # 避免宿主机目录缺失时 Docker 以 root 创建导致非 root 进程写失败。
      # environment 优先级高于 env_file, 会覆盖 .env 中的 DATABASE_URL
      DATABASE_URL: sqlite:////app/db/feishu_agent.db
    volumes:
      - ./data:/app/data
      - db_data:/app/db
      - memory_data:/app/.memory
      - model_cache:/home/appuser/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  model_cache:
  db_data:
  memory_data:
